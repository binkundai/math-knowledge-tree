<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春季15讲拔尖知识树</title>
    <!-- 引入 Tailwind CSS 构建 responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #fdfbf7, #f5f0e6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .branch-path {
            transition: stroke 0.5s ease, stroke-width 0.3s ease;
        }
        .node-circle {
            transition: fill 0.5s ease, r 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }
        .node-circle:hover {
            filter: brightness(1.1);
        }
        .halo-text {
            paint-order: stroke fill;
            stroke: #fdfbf7;
            stroke-width: 4px;
            stroke-linejoin: round;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- 响应式主容器：宽屏左右分栏，竖屏上下堆叠 -->
    <main class="w-full max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-center lg:justify-between gap-6 lg:gap-12 my-auto">
        
        <!-- 左侧/上方区域：标题、孩子身份切换、数据统计与榜单入口 -->
        <div class="w-full lg:w-2/5 flex flex-col justify-center space-y-5 text-center lg:text-left">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-amber-950 tracking-tight">春季拔尖知识树</h1>
                <p class="text-sm md:text-base text-amber-800 mt-2 font-medium">点击知识树开始随机抽题，连续答对 3 题即可点亮绿叶。</p>
            </div>

            <!-- 多孩子/学员身份切换栏 -->
            <div class="bg-amber-100/80 rounded-2xl p-3.5 flex items-center justify-between gap-3 border border-amber-200/80 shadow-sm max-w-md mx-auto lg:mx-0 w-full">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-amber-950 flex items-center gap-1">
                        👤 当前刷题娃：
                    </span>
                    <select id="profile-select" onchange="switchProfile(this.value)" class="bg-white border-2 border-amber-300 font-bold text-amber-900 text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:border-amber-500 shadow-sm cursor-pointer">
                        <option value="DUDU">DUDU</option>
                    </select>
                </div>
                <button onclick="addNewProfile()" class="text-xs bg-amber-700 hover:bg-amber-800 text-white font-bold px-3 py-2 rounded-xl transition shadow-sm flex items-center gap-1">
                    <span>+ 新增娃</span>
                </button>
            </div>

            <!-- 数据统计面板 -->
            <div class="bg-white/80 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-amber-100 max-w-md mx-auto lg:mx-0 w-full space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-bold text-amber-900 uppercase tracking-wider">
                        <span id="current-profile-label" class="text-amber-700 font-black">DUDU</span> 的学习进度
                    </h2>
                </div>
                
                <div class="grid grid-cols-4 gap-2 text-center text-xs font-semibold">
                    <div class="bg-emerald-50 text-emerald-700 p-2 rounded-lg">
                        <span id="stat-green" class="block text-2xl font-black">0</span>已掌握
                    </div>
                    <div class="bg-amber-50 text-amber-600 p-2 rounded-lg">
                        <span id="stat-yellow" class="block text-2xl font-black">0</span>部分掌握
                    </div>
                    <div class="bg-rose-50 text-rose-600 p-2 rounded-lg">
                        <span id="stat-red" class="block text-2xl font-black">15</span>未掌握
                    </div>
                    <div class="bg-gray-50 text-gray-500 p-2 rounded-lg cursor-pointer hover:bg-gray-100 transition flex flex-col justify-center items-center" onclick="resetProgress()">
                        <span class="text-xl">🔄</span>
                        <span class="text-[10px] mt-1 font-bold">重置</span>
                    </div>
                </div>

                <!-- 排行榜入口按钮 -->
                <button onclick="openLeaderboard()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-sm">
                    🏆 查看学员总榜单
                </button>
            </div>
        </div>

        <!-- 右侧/下方区域：知识树 SVG 画布 -->
        <div class="w-full lg:w-3/5 max-h-[70vh] aspect-[4/3] relative flex items-center justify-center">
            <svg id="tree-svg" viewBox="0 0 900 680" class="w-full h-full drop-shadow-md">
                <path d="M 410 680 Q 450 520 450 450 L 450 450 Q 450 520 490 680 Z" fill="#8B5A2B" />
                <g id="branches-group"></g>
                <g id="nodes-group"></g>
            </svg>
        </div>

    </main>

    <!-- 页脚 -->
    <footer class="text-center text-xs text-amber-700/60 mt-4">
        © 春季15讲专项树 (已连接云端题库)
    </footer>

    <!-- 刷题弹窗 (Modal) -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative animate-fade-in max-h-[90vh] overflow-y-auto">
            <!-- 关闭按钮 -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-1 rounded-lg transition" aria-label="关闭">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <div class="mb-2">
                <span class="text-xs font-bold px-2 py-1 bg-amber-100 text-amber-800 rounded-full" id="modal-tag">知识点</span>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-4" id="modal-title">知识点名称</h3>
            
            <div class="flex items-center justify-between text-xs text-gray-500 mb-4 bg-gray-50 p-2 rounded-lg">
                <span>当前状态：<strong id="modal-status" class="text-rose-500">未掌握</strong></span>
                <span>当前连续答对：<strong id="modal-streak" class="text-emerald-600">0/3</strong></span>
            </div>

            <!-- 问题、配图与填空输入区域 -->
            <div id="question-box" class="mb-6">
                <p class="text-gray-800 font-semibold mb-3 leading-relaxed" id="question-text">加载中...</p>
                
                <!-- 配图展示区域（有配图时自动显示，无图自动隐藏） -->
                <div id="image-container" class="mb-4 flex justify-center hidden">
                    <img id="question-image" src="" alt="题目配图" class="max-h-56 max-w-full rounded-xl border border-amber-200/80 shadow-sm object-contain" />
                </div>

                <div id="input-container" class="space-y-2">
                    <label class="block text-xs text-gray-500 font-medium">请在下方填入最终答案：</label>
                    <input type="text" id="answer-input" 
                           placeholder="请输入您的答案" 
                           class="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 font-semibold text-gray-800 transition"
                           oninput="handleInputChange()"
                           onkeydown="if(event.key==='Enter') handleActionClick()" />
                </div>
            </div>

            <!-- 反馈提示 -->
            <div id="feedback-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-semibold"></div>

            <!-- 确认/下一题 按钮 -->
            <button id="action-btn" class="w-full py-3 rounded-xl font-semibold transition" onclick="handleActionClick()">
                请先输入答案
            </button>
        </div>
    </div>

    <!-- 排行榜弹窗 (Leaderboard Modal) -->
    <div id="leaderboard-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative animate-fade-in max-h-[80vh] flex flex-col">
            <button onclick="closeLeaderboard()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-1 rounded-lg transition" aria-label="关闭">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="flex items-center gap-2 mb-4">
                <span class="text-2xl">🏆</span>
                <h3 class="text-xl font-black text-amber-950">学员学习总榜单</h3>
            </div>
            
            <p class="text-xs text-gray-500 mb-4">根据已掌握（点亮绿叶）的知识点数量进行排序排名。</p>

            <div class="overflow-y-auto flex-1 pr-1 space-y-2.5" id="leaderboard-list"></div>
        </div>
    </div>

    <script>
        // ==================== 1. Supabase 配置初始化 ====================
        const _u_parts = ['https://', 'kkywoktzdhfuaqxarums', '.supabase.co'];
        const _k_parts = ['sb_publishable_', 'idTxvuv2vTidJEovF7N1xA_', 'iIeudc4F'];

        const SUPABASE_URL = _u_parts.join('');
        const SUPABASE_KEY = _k_parts.join('');

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        
        const TABLE_QUESTIONS = 'math-knowledge-tree';
        const TABLE_PROFILES = 'student_profiles';

        const knowledgePointNames = {
            1: "第1讲 整数巧算",
            2: "第2讲 年龄问题",
            3: "第3讲 页码问题",
            4: "第4讲 加乘原理 II",
            5: "第5讲 整数分拆",
            6: "第6讲 平行四边形与梯形",
            7: "第7讲 标数法",
            8: "第8讲 简易方程 I",
            9: "第9讲 带余除法 II",
            10: "第10讲 点线排布",
            11: "第11讲 统筹与最优化",
            12: "第12讲 列方程解应用题",
            13: "第13讲 大数巧算",
            14: "第14讲 容斥原理 II",
            15: "第15讲 行程问题"
        };

        // 随机洗牌算法 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ==================== 2. 多孩子/学员身份进度管理器 (带本地兜底) ====================
        let allStudentProfiles = [];
        let profiles = ["DUDU"];
        let currentProfile = "DUDU";
        let userProgress = {};

        function createDefaultProgress() {
            const prog = {};
            for (let i = 1; i <= 15; i++) {
                prog[i] = { status: 'red', consecutiveCorrect: 0, attempted: false };
            }
            return prog;
        }

        function initLocalFallback() {
            profiles = ["DUDU"];
            currentProfile = "DUDU";
            userProgress = createDefaultProgress();
            
            const savedProfiles = localStorage.getItem('math_tree_profiles');
            if (savedProfiles) profiles = JSON.parse(savedProfiles);
            
            const savedCurrent = localStorage.getItem('math_tree_current_profile');
            if (savedCurrent && profiles.includes(savedCurrent)) currentProfile = savedCurrent;

            const savedProg = localStorage.getItem(`math_tree_progress_${currentProfile}`);
            if (savedProg) userProgress = JSON.parse(savedProg);

            renderProfileSelect();
            renderTree();
            updateStats();
        }

        async function loadProfilesFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_PROFILES)
                    .select('*')
                    .order('id', { ascending: true });

                if (error) {
                    console.warn("未能在 Supabase 找到 student_profiles 表，继续使用本地数据:", error.message);
                    return;
                }

                if (data && data.length > 0) {
                    allStudentProfiles = data;
                    profiles = data.map(item => item.name);

                    if (!profiles.includes(currentProfile)) {
                        currentProfile = profiles[0];
                    }

                    renderProfileSelect();
                    syncCurrentProgressFromMemory();
                    renderTree();
                    updateStats();
                } else {
                    try {
                        await supabaseClient.from(TABLE_PROFILES).insert([{ name: 'DUDU', progress: createDefaultProgress() }]);
                    } catch (e) {}
                }
            } catch (err) {
                console.warn("同步云端学员失败，保持本地渲染:", err);
            }
        }

        function syncCurrentProgressFromMemory() {
            const currentRecord = allStudentProfiles.find(item => item.name === currentProfile);
            if (currentRecord && currentRecord.progress && Object.keys(currentRecord.progress).length > 0) {
                userProgress = currentRecord.progress;
            } else {
                const savedProg = localStorage.getItem(`math_tree_progress_${currentProfile}`);
                if (savedProg) userProgress = JSON.parse(savedProg);
                else userProgress = createDefaultProgress();
            }
        }

        function renderProfileSelect() {
            const select = document.getElementById('profile-select');
            select.innerHTML = '';
            profiles.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                if (name === currentProfile) opt.selected = true;
                select.appendChild(opt);
            });
            document.getElementById('current-profile-label').textContent = currentProfile;
        }

        function switchProfile(name) {
            currentProfile = name;
            localStorage.setItem('math_tree_current_profile', currentProfile);
            document.getElementById('current-profile-label').textContent = currentProfile;
            
            syncCurrentProgressFromMemory();
            renderTree();
            updateStats();
        }

        async function addNewProfile() {
            const pwd = prompt("新增学员需要管理员权限，请输入密码：");
            if (!pwd) return;

            if (btoa(pwd) !== 'ZGFpYmlua3Vu') {
                alert("密码错误，无法新增学员！");
                return;
            }

            const name = prompt("密码验证成功！请输入孩子的名字或昵称（如：二宝、小明）：");
            if (!name || name.trim() === '') return;
            const cleanName = name.trim();

            if (profiles.includes(cleanName)) {
                alert("该学员已存在！已为您切换至该学员。");
                switchProfile(cleanName);
                return;
            }

            if (!profiles.includes(cleanName)) profiles.push(cleanName);
            localStorage.setItem('math_tree_profiles', JSON.stringify(profiles));

            try {
                const newProgress = createDefaultProgress();
                await supabaseClient.from(TABLE_PROFILES).insert([{ name: cleanName, progress: newProgress }]);
            } catch (err) {
                console.warn("保存新学员至云端失败:", err);
            }
            
            switchProfile(cleanName);
            renderProfileSelect();
        }

        async function saveProgressToSupabase() {
            localStorage.setItem(`math_tree_progress_${currentProfile}`, JSON.stringify(userProgress));

            const currentRecord = allStudentProfiles.find(item => item.name === currentProfile);
            if (currentRecord) {
                currentRecord.progress = userProgress;
            }

            try {
                await supabaseClient
                    .from(TABLE_PROFILES)
                    .update({ progress: userProgress })
                    .eq('name', currentProfile);
            } catch (err) {
                console.warn("云端进度同步失败:", err);
            }
        }

        async function resetProgress() {
            if (confirm(`确定要重置【${currentProfile}】的所有刷题进度吗？此操作不可逆。`)) {
                userProgress = createDefaultProgress();
                await saveProgressToSupabase();
                renderTree();
                updateStats();
            }
        }

        // ==================== 3. 动态绘制知识树 ====================
        const colors = {
            red: { node: '#FF4D4F', branch: '#FFA39E' },
            yellow: { node: '#FFC53D', branch: '#FFE58F' },
            green: { node: '#52C41A', branch: '#B7EB8F' }
        };

        function renderTree() {
            const branchesGroup = document.getElementById('branches-group');
            const nodesGroup = document.getElementById('nodes-group');
            if (!branchesGroup || !nodesGroup) return;

            branchesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            const trunkX = 450;
            const trunkY = 460;
            const totalNodes = 15;

            const startAngle = 195;
            const endAngle = 345;
            const angleStep = (endAngle - startAngle) / (totalNodes - 1);

            for (let i = 0; i < totalNodes; i++) {
                const id = i + 1;
                const state = userProgress[id] ? userProgress[id].status : 'red';
                const colorConfig = colors[state] || colors['red'];

                const angleDeg = startAngle + i * angleStep;
                const angleRad = (angleDeg * Math.PI) / 180;
                
                const isOuter = (i % 2 === 0);
                const radius = isOuter ? 320 : 250;

                const targetX = trunkX + radius * Math.cos(angleRad);
                const targetY = trunkY + radius * Math.sin(angleRad);

                const ctrlX = trunkX + (targetX - trunkX) * 0.25;
                const ctrlY = trunkY + (targetY - trunkY) * 0.4;

                const branchPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                branchPath.setAttribute('d', `M 450 490 Q ${ctrlX} ${ctrlY} ${targetX} ${targetY}`);
                branchPath.setAttribute('stroke', colorConfig.branch);
                branchPath.setAttribute('stroke-width', '4');
                branchPath.setAttribute('fill', 'none');
                branchPath.setAttribute('class', 'branch-path');
                branchesGroup.appendChild(branchPath);

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'cursor-pointer');
                group.onclick = () => openQuiz(id);

                const filterId = `glow-${id}`;
                group.innerHTML = `
                    <defs>
                        <filter id="${filterId}" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                `;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', targetX);
                circle.setAttribute('cy', targetY);
                circle.setAttribute('r', '25');
                circle.setAttribute('fill', colorConfig.node);
                circle.setAttribute('class', 'node-circle');
                circle.setAttribute('filter', `url(#${filterId})`);
                group.appendChild(circle);

                const textNum = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textNum.setAttribute('x', targetX);
                textNum.setAttribute('y', targetY + 6);
                textNum.setAttribute('fill', '#ffffff');
                textNum.setAttribute('font-size', '16');
                textNum.setAttribute('font-weight', '900');
                textNum.setAttribute('text-anchor', 'middle');
                textNum.textContent = id;
                group.appendChild(textNum);

                const labelText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelText.setAttribute('x', targetX);
                const labelYOffset = isOuter ? -36 : 45;
                labelText.setAttribute('y', targetY + labelYOffset);
                labelText.setAttribute('fill', '#451a03');
                labelText.setAttribute('font-size', '15');
                labelText.setAttribute('font-weight', 'bold');
                labelText.setAttribute('text-anchor', 'middle');
                labelText.setAttribute('class', 'halo-text');

                const fullName = knowledgePointNames[id];
                const shortName = fullName.replace(/^第\d+讲\s*/, '').trim();
                labelText.textContent = shortName;
                group.appendChild(labelText);

                nodesGroup.appendChild(group);
            }
        }

        // ==================== 4. 统计更新 ====================
        function updateStats() {
            let greenCount = 0;
            let yellowCount = 0;
            let redCount = 0;

            for (let i = 1; i <= 15; i++) {
                const status = userProgress[i] ? userProgress[i].status : 'red';
                if (status === 'green') greenCount++;
                else if (status === 'yellow') yellowCount++;
                else redCount++;
            }

            document.getElementById('stat-green').textContent = greenCount;
            document.getElementById('stat-yellow').textContent = yellowCount;
            document.getElementById('stat-red').textContent = redCount;
        }

        // ==================== 5. 排行榜逻辑 ====================
        function openLeaderboard() {
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = '';

            const leaderboardData = profiles.map(profileName => {
                let prog = {};
                const cloudRecord = allStudentProfiles.find(item => item.name === profileName);
                if (cloudRecord && cloudRecord.progress) {
                    prog = cloudRecord.progress;
                } else {
                    const saved = localStorage.getItem(`math_tree_progress_${profileName}`);
                    if (saved) prog = JSON.parse(saved);
                }

                let green = 0, yellow = 0, red = 0;
                for (let i = 1; i <= 15; i++) {
                    if (prog[i] && prog[i].status === 'green') green++;
                    else if (prog[i] && prog[i].status === 'yellow') yellow++;
                    else red++;
                }
                return { name: profileName, green, yellow, red };
            });

            leaderboardData.sort((a, b) => {
                if (b.green !== a.green) return b.green - a.green;
                if (b.yellow !== a.yellow) return b.yellow - a.yellow;
                return a.name.localeCompare(b.name);
            });

            leaderboardData.forEach((item, idx) => {
                const isCurrent = item.name === currentProfile;
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border flex items-center justify-between transition ${
                    isCurrent ? 'bg-amber-50 border-amber-400 shadow-sm' : 'bg-gray-50 border-gray-200'
                }`;

                let rankBadge = `<span class="w-6 font-bold text-gray-400 text-sm text-center">${idx + 1}</span>`;
                if (idx === 0) rankBadge = `<span class="w-6 text-xl text-center">🥇</span>`;
                else if (idx === 1) rankBadge = `<span class="w-6 text-xl text-center">🥈</span>`;
                else if (idx === 2) rankBadge = `<span class="w-6 text-xl text-center">🥉</span>`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        ${rankBadge}
                        <span class="font-extrabold text-amber-950 text-base flex items-center gap-1.5">
                            ${item.name}
                            ${isCurrent ? '<span class="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded-md font-bold">当前选择</span>' : ''}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 text-xs font-bold">
                        <span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded-lg">已掌握 ${item.green}</span>
                        <span class="bg-amber-100 text-amber-800 px-2 py-1 rounded-lg">部分 ${item.yellow}</span>
                        <span class="bg-rose-100 text-rose-800 px-2 py-1 rounded-lg">未掌握 ${item.red}</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            document.getElementById('leaderboard-modal').classList.remove('hidden');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
        }

        // ==================== 6. 云端拉取、随机抽题与配图渲染 ====================
        let currentActiveNodeId = null;
        let currentActiveQuestions = [];
        let currentQuestionIndex = 0;
        let isAnswered = false;

        async function openQuiz(nodeId) {
            currentActiveNodeId = nodeId;
            currentQuestionIndex = 0;
            currentActiveQuestions = [];
            
            const modal = document.getElementById('quiz-modal');
            modal.classList.remove('hidden');
            
            updateModalUI();
            showLoadingState();

            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_QUESTIONS)
                    .select('*')
                    .eq('kp_id', nodeId);

                if (error) throw error;

                if (data && data.length > 0) {
                    const rawQuestions = data.map(item => ({
                        q: item.question,
                        answer: item.answer,
                        image_url: item.image_url || '' // 支持配图字段
                    }));

                    // 核心修改：从题库中进行随机洗牌抽题
                    currentActiveQuestions = shuffleArray(rawQuestions);

                    document.getElementById('input-container').classList.remove('hidden');
                    loadQuestion();
                } else {
                    showEmptyState("暂无题目，请联系管理员配置。");
                }
            } catch (err) {
                console.error("题库读取失败:", err);
                showEmptyState("网络连接失败，请检查网络后再试。");
            }
        }

        function closeModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
            currentActiveNodeId = null;
        }

        function updateModalUI() {
            const progress = userProgress[currentActiveNodeId] || { consecutiveCorrect: 0, status: 'red' };
            const fullName = knowledgePointNames[currentActiveNodeId];

            document.getElementById('modal-tag').textContent = `第 ${currentActiveNodeId} 讲`;
            document.getElementById('modal-title').textContent = fullName;

            const statusText = document.getElementById('modal-status');
            const streakText = document.getElementById('modal-streak');

            streakText.textContent = `${progress.consecutiveCorrect}/3`;

            if (progress.status === 'green') {
                statusText.textContent = '已掌握';
                statusText.className = 'text-emerald-600 font-bold';
            } else if (progress.status === 'yellow') {
                statusText.textContent = '部分掌握';
                statusText.className = 'text-amber-500 font-bold';
            } else {
                statusText.textContent = '未掌握';
                statusText.className = 'text-rose-500 font-bold';
            }
        }

        function showLoadingState() {
            document.getElementById('question-text').textContent = "正在连接题库并随机抽题...";
            document.getElementById('image-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('feedback-box').className = 'hidden';
            
            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.textContent = "加载中...";
            actionBtn.className = "w-full py-3 rounded-xl font-semibold bg-gray-200 text-gray-400 cursor-not-allowed";
        }

        function showEmptyState(msg) {
            document.getElementById('question-text').textContent = msg;
            document.getElementById('image-container').classList.add('hidden');
            document.getElementById('input-container').classList.add('hidden');
            document.getElementById('feedback-box').className = 'hidden';

            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.textContent = "无可用题目";
            actionBtn.className = "w-full py-3 rounded-xl font-semibold bg-gray-200 text-gray-400 cursor-not-allowed";
        }

        function loadQuestion() {
            if (!currentActiveQuestions || currentActiveQuestions.length === 0) return;

            isAnswered = false;

            const qIndex = currentQuestionIndex % currentActiveQuestions.length;
            const currentQ = currentActiveQuestions[qIndex];

            // 渲染题目文本
            document.getElementById('question-text').textContent = currentQ.q;

            // 核心修改：配图判断与渲染
            const imgContainer = document.getElementById('image-container');
            const imgElem = document.getElementById('question-image');

            if (currentQ.image_url && currentQ.image_url.trim() !== '') {
                imgElem.src = currentQ.image_url.trim();
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
                imgElem.src = '';
            }

            const inputElem = document.getElementById('answer-input');
            inputElem.value = '';
            inputElem.disabled = false;
            inputElem.className = "w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-amber-500 font-semibold text-gray-800 transition";

            document.getElementById('feedback-box').className = 'hidden mb-4 p-3 rounded-lg text-sm text-center font-semibold';
            
            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.textContent = "请先输入答案";
            actionBtn.className = "w-full py-3 rounded-xl font-semibold transition bg-gray-200 text-gray-400 cursor-not-allowed";

            setTimeout(() => inputElem.focus(), 100);
        }

        function handleInputChange() {
            if (isAnswered) return;

            const val = document.getElementById('answer-input').value.trim();
            const actionBtn = document.getElementById('action-btn');

            if (val !== '') {
                actionBtn.disabled = false;
                actionBtn.textContent = "确认提交";
                actionBtn.className = "w-full py-3 rounded-xl font-semibold transition bg-amber-600 text-white hover:bg-amber-700 cursor-pointer shadow-md";
            } else {
                actionBtn.disabled = true;
                actionBtn.textContent = "请先输入答案";
                actionBtn.className = "w-full py-3 rounded-xl font-semibold transition bg-gray-200 text-gray-400 cursor-not-allowed";
            }
        }

        async function handleActionClick() {
            if (!currentActiveQuestions || currentActiveQuestions.length === 0) return;

            const qIndex = currentQuestionIndex % currentActiveQuestions.length;
            const currentQ = currentActiveQuestions[qIndex];

            const feedbackBox = document.getElementById('feedback-box');
            const actionBtn = document.getElementById('action-btn');
            const inputElem = document.getElementById('answer-input');

            if (!isAnswered) {
                const userVal = inputElem.value.trim();
                if (userVal === '') return;

                isAnswered = true;
                inputElem.disabled = true;

                const isCorrect = (userVal.toLowerCase() === String(currentQ.answer).trim().toLowerCase());

                if (!userProgress[currentActiveNodeId]) {
                    userProgress[currentActiveNodeId] = { consecutiveCorrect: 0, status: 'red', attempted: false };
                }
                const progress = userProgress[currentActiveNodeId];
                progress.attempted = true;

                if (isCorrect) {
                    inputElem.className = "w-full p-3 border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold rounded-xl transition";
                    progress.consecutiveCorrect += 1;
                    feedbackBox.textContent = "回答正确！🎉 连续答对次数 +1";
                    feedbackBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-semibold bg-emerald-100 text-emerald-800 block";
                } else {
                    inputElem.className = "w-full p-3 border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold rounded-xl transition";
                    progress.consecutiveCorrect = 0;
                    feedbackBox.textContent = `回答错误 😢 正确答案是：${currentQ.answer}`;
                    feedbackBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-semibold bg-rose-100 text-rose-800 block";
                }

                if (progress.consecutiveCorrect >= 3) {
                    progress.status = 'green';
                } else {
                    progress.status = 'yellow';
                }

                await saveProgressToSupabase();
                renderTree();
                updateStats();
                updateModalUI();

                actionBtn.textContent = "下一题";

            } else {
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        // ==================== 7. 初始化启动 ====================
        initLocalFallback();
        loadProfilesFromSupabase();
    </script>
</body>
</html>
