<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春季知识点树</title>
    <!-- 引入 Tailwind CSS 用于快速构建美观的 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #fdfbf7, #f5f0e6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* 树枝和节点的动画过渡 */
        .branch-path {
            transition: stroke 0.5s ease, stroke-width 0.3s ease;
        }
        .node-circle {
            transition: fill 0.5s ease, r 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }
        .node-circle:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 pb-8">

    <!-- 顶部标题 -->
    <header class="text-center mt-4">
        <h1 class="text-2xl font-bold text-amber-900">春季知识点拔尖树</h1>
        <p class="text-sm text-amber-700 mt-1">点击圆形节点开始刷题，连续答对3题即可点亮绿色</p>
    </header>

    <!-- 知识树画布区域 -->
    <div class="w-full max-w-lg aspect-[4/5] relative flex items-center justify-center my-4">
        <!-- SVG 动态绘制树结构 -->
        <svg id="tree-svg" viewBox="0 0 800 900" class="w-full h-full">
            <!-- 树干定义 -->
            <path d="M 370 900 Q 400 650 400 550 L 400 550 Q 400 650 430 900 Z" fill="#8B5A2B" />
            <!-- 树枝与节点将通过 JS 动态渲染到这里 -->
            <g id="branches-group"></g>
            <g id="nodes-group"></g>
        </svg>
    </div>

    <!-- 底部状态统计栏 -->
    <div class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-amber-100">
        <div class="grid grid-cols-4 gap-2 text-center text-xs font-semibold">
            <div class="bg-emerald-50 text-emerald-700 p-2 rounded-lg">
                <span id="stat-green" class="block text-lg font-bold">0</span>已掌握 (绿)
            </div>
            <div class="bg-amber-50 text-amber-600 p-2 rounded-lg">
                <span id="stat-yellow" class="block text-lg font-bold">0</span>部分掌握 (黄)
            </div>
            <div class="bg-rose-50 text-rose-600 p-2 rounded-lg">
                <span id="stat-red" class="block text-lg font-bold">15</span>未掌握 (红)
            </div>
            <div class="bg-gray-50 text-gray-500 p-2 rounded-lg cursor-pointer hover:bg-gray-100 transition" onclick="resetProgress()">
                <span class="block text-lg font-bold">🔄</span>重置进度
            </div>
        </div>
    </div>

    <!-- 刷题弹窗 (Modal) -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative animate-fade-in">
            <!-- 改进的关闭按钮：使用优雅的 SVG X 图标 -->
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 p-1 rounded-lg transition" aria-label="关闭">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            
            <!-- 知识点名称 -->
            <div class="mb-2">
                <span class="text-xs font-bold px-2 py-1 bg-amber-100 text-amber-800 rounded-full" id="modal-tag">知识点</span>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-4" id="modal-title">知识点名称</h3>
            
            <!-- 进度提示 -->
            <div class="flex items-center justify-between text-xs text-gray-500 mb-4 bg-gray-50 p-2 rounded-lg">
                <span>当前状态：<strong id="modal-status" class="text-rose-500">未掌握</strong></span>
                <span>当前连续答对：<strong id="modal-streak" class="text-emerald-600">0/3</strong></span>
            </div>

            <!-- 问题展示区 -->
            <div id="question-box" class="mb-6">
                <p class="text-gray-700 font-medium mb-4" id="question-text">加载中...</p>
                <!-- 选项列表 -->
                <div class="space-y-2" id="options-box">
                    <!-- 动态插入选项 -->
                </div>
            </div>

            <!-- 反馈提示 -->
            <div id="feedback-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-semibold"></div>

            <!-- 改进的多功能操作按钮（确认/下一题） -->
            <button id="action-btn" class="w-full py-3 rounded-xl font-semibold transition" onclick="handleActionClick()">
                请先选择一个答案
            </button>
        </div>
    </div>

    <script>
        // ==================== 1. 题库数据配置 ====================
        const questionsData = {
            1: {
                name: "1. 两位数乘法",
                questions: [
                    { q: "12 × 11 等于多少？", options: ["121", "132", "142", "152"], correct: 1 },
                    { q: "15 × 15 等于多少？", options: ["225", "235", "245", "255"], correct: 0 },
                    { q: "20 × 14 等于多少？", options: ["260", "270", "280", "290"], correct: 2 }
                ]
            },
            2: {
                name: "2. 除法与余数",
                questions: [
                    { q: "25 ÷ 4 的余数是多少？", options: ["1", "2", "3", "0"], correct: 0 },
                    { q: "47 ÷ 6 的商和余数是多少？", options: ["商7余5", "商8余1", "商7余2", "商8余5"], correct: 0 },
                    { q: "100 ÷ 9 的余数是多少？", options: ["1", "2", "3", "4"], correct: 0 }
                ]
            },
            3: { name: "3. 分数初步认识", questions: [{ q: "1/4 + 2/4 等于多少？", options: ["3/4", "3/8", "1/2", "1"], correct: 0 }, { q: "2/3 里面有几个 1/3？", options: ["1", "2", "3", "4"], correct: 1 }, { q: "1 减去 3/5 等于多少？", options: ["1/5", "2/5", "3/5", "4/5"], correct: 1 }] },
            4: { name: "4. 小数的加减法", questions: [{ q: "0.3 + 0.5 等于多少？", options: ["0.8", "0.08", "8", "0.15"], correct: 0 }, { q: "1.2 - 0.4 等于多少？", options: ["0.8", "1.8", "0.6", "1.6"], correct: 0 }, { q: "5 - 1.5 等于多少？", options: ["3.5", "4.5", "2.5", "3"], correct: 0 }] },
            5: { name: "5. 长度单位换算", questions: [{ q: "3米 等于多少 分米？", options: ["30", "300", "3", "0.3"], correct: 0 }, { q: "50毫米 等于多少 厘米？", options: ["500", "5", "50", "0.5"], correct: 1 }, { q: "2千米 等于多少 米？", options: ["20", "200", "2000", "20000"], correct: 2 }] },
            6: { name: "6. 重量单位换算", questions: [{ q: "2吨 等于多少 千克？", options: ["20", "200", "2000", "20000"], correct: 2 }, { q: "3000克 等于多少 千克？", options: ["3", "30", "300", "0.3"], correct: 0 }, { q: "半吨 等于多少 千克？", options: ["50", "500", "5000", "5"], correct: 1 }] },
            7: { name: "7. 面积的计算", questions: [{ q: "长 5cm、宽 4cm 的长方形面积是多少？", options: ["9 c㎡", "18 c㎡", "20 c㎡", "40 c㎡"], correct: 2 }, { q: "边长 6cm 的正方形面积是多少？", options: ["24 c㎡", "12 c㎡", "36 c㎡", "48 c㎡"], correct: 2 }, { q: "面积是 16 c㎡ 的正方形，边长是多少？", options: ["4cm", "8cm", "2cm", "16cm"], correct: 0 }] },
            8: { name: "8. 周长的计算", questions: [{ q: "长 6cm、宽 3cm 的长方形周长是多少？", options: ["18cm", "9cm", "12cm", "24cm"], correct: 0 }, { q: "边长 5cm 的正方形周长是多少？", options: ["10cm", "20cm", "25cm", "15cm"], correct: 1 }, { q: "周长是 12cm 的正方形，边长是多少？", options: ["3cm", "4cm", "6cm", "2cm"], correct: 0 }] },
            9: { name: "9. 时间的换算", questions: [{ q: "2小时40分钟 等于多少分钟？", options: ["100分钟", "160分钟", "140分钟", "120分钟"], correct: 1 }, { q: "180秒 等于多少分钟？", options: ["2分钟", "3分钟", "4分钟", "5分钟"], correct: 1 }, { q: "半天 有多少小时？", options: ["6小时", "12小时", "24小时", "8小时"], correct: 1 }] },
            10: { name: "10. 认读钟表", questions: [{ q: "分针走一大格是几分钟？", options: ["1分钟", "5分钟", "10分钟", "12分钟"], correct: 1 }, { q: "时针从3走到6，经过了多久？", options: ["3分钟", "15分钟", "3小时", "6小时"], correct: 2 }, { q: "秒针走一圈，分针走几小格？", options: ["1小格", "5小格", "12小格", "60小格"], correct: 0 }] },
            11: { name: "11. 轴对称图形", questions: [{ q: "下列哪个汉字是轴对称图形？", options: ["中", "国", "吉", "A和C都是"], correct: 3 }, { q: "正方形有几条对称轴？", options: ["2条", "4条", "8条", "无数条"], correct: 1 }, { q: "等边三角形有几条对称轴？", options: ["1条", "2条", "3条", "0条"], correct: 2 }] },
            12: { name: "12. 数据的整理", questions: [{ q: "统计图里最常用来表示数量多少的是？", options: ["条形统计图", "折线统计图", "扇形统计图", "表格"], correct: 0 }, { q: "平均数能代表什么？", options: ["最大值", "最小值", "整体平均水平", "最中间的数"], correct: 2 }, { q: "有3个班，平均每班40人，总人数是？", options: ["40人", "120人", "80人", "160人"], correct: 1 }] },
            13: { name: "13. 搭配问题", questions: [{ q: "2件上衣 and 3条裤子，一共有几种穿法？", options: ["5种", "6种", "8种", "9种"], correct: 1 }, { q: "有3个小朋友，每两人握一次手，共握几次？", options: ["3次", "6次", "9次", "4次"], correct: 0 }, { q: "1、2、3三个数字能组成几个不同的两位数？", options: ["3个", "6个", "9个", "4个"], correct: 1 }] },
            14: { name: "14. 周期规律", questions: [{ q: "按“红黄蓝红黄蓝...”排列，第10个是什么颜色？", options: ["红", "黄", "蓝", "无法确定"], correct: 0 }, { q: "按“AABBAABB...”排列，第15个字母是？", options: ["A", "B", "C", "D"], correct: 1 }, { q: "今天是星期一，再过8天是星期几？", options: ["星期一", "星期二", "星期三", "星期日"], correct: 1 }] },
            15: { name: "15. 简单重叠问题", questions: [{ q: "排队时，小明从前数第5，从后数第4，这队共几人？", options: ["9人", "8人", "7人", "10人"], correct: 1 }, { q: "两张10厘米的纸条重叠2厘米粘在一起，总长？", options: ["20厘米", "18厘米", "16厘米", "19厘米"], correct: 1 }, { q: "班里有8人喜欢画画，7人喜欢唱歌，其中3人两样都喜欢，班里共有多少人？", options: ["15人", "12人", "11人", "18人"], correct: 1 }] }
        };

        // ==================== 2. 状态管理器 ====================
        let userProgress = {};

        function initProgress() {
            const saved = localStorage.getItem('spring_tree_progress_v1');
            if (saved) {
                userProgress = JSON.parse(saved);
            } else {
                for (let i = 1; i <= 15; i++) {
                    userProgress[i] = {
                        status: 'red', // 'red' | 'yellow' | 'green'
                        consecutiveCorrect: 0,
                        attempted: false
                    };
                }
                saveProgress();
            }
        }

        function saveProgress() {
            localStorage.setItem('spring_tree_progress_v1', JSON.stringify(userProgress));
        }

        function resetProgress() {
            if (confirm("确定要重置所有刷题进度吗？此操作不可逆。")) {
                localStorage.removeItem('spring_tree_progress_v1');
                initProgress();
                renderTree();
                updateStats();
            }
        }

        // ==================== 3. 动态绘制知识树 ====================
        const colors = {
            red: { node: '#FF4D4F', branch: '#FFA39E', glow: 'rgba(255, 77, 79, 0.4)' },
            yellow: { node: '#FFC53D', branch: '#FFE58F', glow: 'rgba(255, 197, 61, 0.4)' },
            green: { node: '#52C41A', branch: '#B7EB8F', glow: 'rgba(82, 196, 26, 0.4)' }
        };

        function renderTree() {
            const branchesGroup = document.getElementById('branches-group');
            const nodesGroup = document.getElementById('nodes-group');
            branchesGroup.innerHTML = '';
            nodesGroup.innerHTML = '';

            const trunkX = 400;
            const trunkY = 550;
            const totalNodes = 15;

            const startAngle = 195;
            const endAngle = 345;
            const angleStep = (endAngle - startAngle) / (totalNodes - 1);

            for (let i = 0; i < totalNodes; i++) {
                const id = i + 1;
                const state = userProgress[id].status;
                const colorConfig = colors[state];

                const angleDeg = startAngle + i * angleStep;
                const angleRad = (angleDeg * Math.PI) / 180;
                const radius = i % 2 === 0 ? 330 : 250;

                const targetX = trunkX + radius * Math.cos(angleRad);
                const targetY = trunkY + radius * Math.sin(angleRad);

                const ctrlX = trunkX + (targetX - trunkX) * 0.25;
                const ctrlY = trunkY + (targetY - trunkY) * 0.55;

                const branchPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                branchPath.setAttribute('d', `M ${trunkX} ${trunkY} Q ${ctrlX} ${ctrlY} ${targetX} ${targetY}`);
                branchPath.setAttribute('stroke', colorConfig.branch);
                branchPath.setAttribute('stroke-width', '4');
                branchPath.setAttribute('fill', 'none');
                branchPath.setAttribute('class', 'branch-path');
                branchesGroup.appendChild(branchPath);

                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.setAttribute('class', 'cursor-pointer');
                group.onclick = () => openQuiz(id);

                const filterId = `glow-${id}`;
                group.innerHTML = `
                    <defs>
                        <filter id="${filterId}" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                `;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', targetX);
                circle.setAttribute('cy', targetY);
                circle.setAttribute('r', '20');
                circle.setAttribute('fill', colorConfig.node);
                circle.setAttribute('class', 'node-circle');
                circle.setAttribute('filter', `url(#${filterId})`);
                group.appendChild(circle);

                const textNum = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                textNum.setAttribute('x', targetX);
                textNum.setAttribute('y', targetY + 5);
                textNum.setAttribute('fill', '#ffffff');
                textNum.setAttribute('font-size', '13');
                textNum.setAttribute('font-weight', 'bold');
                textNum.setAttribute('text-anchor', 'middle');
                textNum.textContent = id;
                group.appendChild(textNum);

                const labelText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelText.setAttribute('x', targetX);
                labelText.setAttribute('y', targetY + (targetY > trunkY ? 40 : -32));
                labelText.setAttribute('fill', '#5c3f15');
                labelText.setAttribute('font-size', '12');
                labelText.setAttribute('font-weight', '500');
                labelText.setAttribute('text-anchor', 'middle');
                const shortName = questionsData[id].name.split('.')[1].trim();
                labelText.textContent = shortName;
                group.appendChild(labelText);

                nodesGroup.appendChild(group);
            }
        }

        // ==================== 4. 统计更新 ====================
        function updateStats() {
            let greenCount = 0;
            let yellowCount = 0;
            let redCount = 0;

            for (let i = 1; i <= 15; i++) {
                if (userProgress[i].status === 'green') greenCount++;
                else if (userProgress[i].status === 'yellow') yellowCount++;
                else redCount++;
            }

            document.getElementById('stat-green').textContent = greenCount;
            document.getElementById('stat-yellow').textContent = yellowCount;
            document.getElementById('stat-red').textContent = redCount;
        }

        // ==================== 5. 弹窗和答题逻辑 ====================
        let currentActiveNodeId = null;
        let currentQuestionIndex = 0;
        let selectedOptionIdx = null;  // 记录当前点击选择但尚未确认的选项
        let isAnswered = false;        // 是否已经点击了确认

        function openQuiz(nodeId) {
            currentActiveNodeId = nodeId;
            currentQuestionIndex = 0;
            
            const modal = document.getElementById('quiz-modal');
            modal.classList.remove('hidden');
            
            updateModalUI();
            loadQuestion();
        }

        function closeModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
            currentActiveNodeId = null;
        }

        function updateModalUI() {
            const progress = userProgress[currentActiveNodeId];
            const data = questionsData[currentActiveNodeId];

            document.getElementById('modal-tag').textContent = `知识点 ${currentActiveNodeId}`;
            document.getElementById('modal-title').textContent = data.name;

            const statusText = document.getElementById('modal-status');
            const streakText = document.getElementById('modal-streak');

            streakText.textContent = `${progress.consecutiveCorrect}/3`;

            if (progress.status === 'green') {
                statusText.textContent = '已掌握';
                statusText.className = 'text-emerald-600 font-bold';
            } else if (progress.status === 'yellow') {
                statusText.textContent = '部分掌握';
                statusText.className = 'text-amber-500 font-bold';
            } else {
                statusText.textContent = '未掌握';
                statusText.className = 'text-rose-500 font-bold';
            }
        }

        function loadQuestion() {
            selectedOptionIdx = null;
            isAnswered = false;

            const data = questionsData[currentActiveNodeId];
            const qIndex = currentQuestionIndex % data.questions.length;
            const currentQ = data.questions[qIndex];

            document.getElementById('question-text').textContent = currentQ.q;

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            // 绘制初始选项
            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.id = `opt-btn-${idx}`;
                btn.className = "w-full text-left p-3 border border-gray-200 rounded-xl hover:bg-amber-50/50 hover:border-amber-300 transition text-sm text-gray-700 font-medium flex items-center justify-between";
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}. ${opt}</span>`;
                btn.onclick = () => selectOption(idx);
                optionsBox.appendChild(btn);
            });

            // 隐藏反馈区
            document.getElementById('feedback-box').className = 'hidden mb-4 p-3 rounded-lg text-sm text-center font-semibold';
            
            // 初始化底部操作按钮为禁用状态（不做选择无法进行下一步）
            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = true;
            actionBtn.textContent = "请先选择一个答案";
            actionBtn.className = "w-full py-3 rounded-xl font-semibold transition bg-gray-200 text-gray-400 cursor-not-allowed";
        }

        // 第一步：点击选项（未确认前，允许用户随意更换调整选择）
        function selectOption(idx) {
            if (isAnswered) return; // 已确认提交，则不能再更换选项

            selectedOptionIdx = idx;

            const data = questionsData[currentActiveNodeId];
            const qIndex = currentQuestionIndex % data.questions.length;
            const currentQ = data.questions[qIndex];

            // 重新刷新选项高亮状态
            for (let i = 0; i < currentQ.options.length; i++) {
                const btn = document.getElementById(`opt-btn-${i}`);
                if (i === idx) {
                    // 高亮选中项为金黄色边框
                    btn.className = "w-full text-left p-3 border-2 border-amber-500 bg-amber-50/70 rounded-xl transition text-sm text-amber-900 font-semibold flex items-center justify-between";
                } else {
                    // 其他选项恢复默认
                    btn.className = "w-full text-left p-3 border border-gray-200 rounded-xl hover:bg-amber-50/50 hover:border-amber-300 transition text-sm text-gray-700 font-medium flex items-center justify-between";
                }
            }

            // 开启下方“确认选择”按钮
            const actionBtn = document.getElementById('action-btn');
            actionBtn.disabled = false;
            actionBtn.textContent = "确认选择";
            actionBtn.className = "w-full py-3 rounded-xl font-semibold transition bg-amber-600 text-white hover:bg-amber-700 cursor-pointer";
        }

        // 第二步：处理底部按钮的点击事件（作为“确认选择”和“下一题”的多功能切换点）
        function handleActionClick() {
            const data = questionsData[currentActiveNodeId];
            const qIndex = currentQuestionIndex % data.questions.length;
            const currentQ = data.questions[qIndex];
            const correctIdx = currentQ.correct;

            const feedbackBox = document.getElementById('feedback-box');
            const actionBtn = document.getElementById('action-btn');

            if (!isAnswered) {
                // 情况一：用户点击“确认选择” —— 进行结果核算并展示正误
                isAnswered = true;

                // 禁用选项点击
                for (let i = 0; i < currentQ.options.length; i++) {
                    const btn = document.getElementById(`opt-btn-${i}`);
                    btn.onclick = null; // 移除事件
                    btn.style.cursor = 'default';
                    
                    // 显示正确与错误视觉反馈
                    if (i === correctIdx) {
                        // 正确项高亮为绿色
                        btn.className = "w-full text-left p-3 border-2 border-emerald-500 bg-emerald-50 rounded-xl transition text-sm text-emerald-800 font-semibold flex items-center justify-between";
                    } else if (i === selectedOptionIdx) {
                        // 用户选错的项标红
                        btn.className = "w-full text-left p-3 border-2 border-rose-500 bg-rose-50 rounded-xl transition text-sm text-rose-800 font-semibold flex items-center justify-between";
                    } else {
                        btn.className = "w-full text-left p-3 border border-gray-100 rounded-xl transition text-sm text-gray-400 flex items-center justify-between";
                    }
                }

                const progress = userProgress[currentActiveNodeId];
                progress.attempted = true;

                if (selectedOptionIdx === correctIdx) {
                    // 正确
                    progress.consecutiveCorrect += 1;
                    feedbackBox.textContent = "回答正确！🎉 连续答对次数 +1";
                    feedbackBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-semibold bg-emerald-100 text-emerald-800 block";
                } else {
                    // 错误，连对清零
                    progress.consecutiveCorrect = 0;
                    feedbackBox.textContent = "回答错误。😢 连续答对清零，再接再厉！";
                    feedbackBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-semibold bg-rose-100 text-rose-800 block";
                }

                // 进度更新判定
                if (progress.consecutiveCorrect >= 3) {
                    progress.status = 'green';
                } else {
                    progress.status = 'yellow';
                }

                saveProgress();
                renderTree();
                updateStats();
                updateModalUI();

                // 锁定答案后，按钮功能立即变更为“下一题”
                actionBtn.textContent = "下一题";

            } else {
                // 情况二：用户点击“下一题” —— 加载新题目并恢复选择状态
                currentQuestionIndex++;
                loadQuestion();
            }
        }

        // ==================== 6. 初始化启动 ====================
        initProgress();
        renderTree();
        updateStats();
    </script>
</body>
</html>
