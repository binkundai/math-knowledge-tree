name: Sync to Gitee

on:
  push:
    branches:
      - main  # 如果您的 GitHub 默认分支叫 master，请改成 master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 GitHub 代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 强制同步推送到 Gitee
        run: |
          # 👈 已修复：去掉前缀用户名，直接将 Token 填在 @gitee.com 前面
          git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/daibinkun/math-knowledge-tree.git
          git push -f gitee main
