name: Sync to Gitee

on:
  push:
    branches:
      - main  # 如果您的分支是 master 请改为 master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 GitHub 代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 强制同步推送到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://daibinkun:${GITEE_TOKEN}@gitee.com/daibinkun/math-knowledge-tree.git
          git push -f gitee main
