name: Sync to Gitee

on:
  push:
    branches:
      - main # 如果您的主分支叫 master，请改成 master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the GitHub repo to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/binkundai
          dst: gitee/comoestas # ⚠️【重要】：请把“您的Gitee用户名”替换为您在Gitee上的真实用户名！
          dst_token: ${{ secrets.GITEE_TOKEN }} # 👈 已修复：将原来的 gitee_token 改为了 dst_token
          static_list: 'math-knowledge-tree'
          force_update: true
